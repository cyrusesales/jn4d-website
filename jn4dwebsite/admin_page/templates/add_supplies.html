{% extends "admin_base.html" %} {% block title %}Add Supplies{%endblock %} {% block content %}
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
></script>
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;" >
  <symbol id="save" viewBox="0 0 16 16" fill="currentColor">
    <path d="M0 1.5A1.5 1.5 0 0 1 1.5 0H3v5.5A1.5 1.5 0 0 0 4.5 7h7A1.5 1.5 0 0 0 13 5.5V0h.086a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5H14v-5.5A1.5 1.5 0 0 0 12.5 9h-9A1.5 1.5 0 0 0 2 10.5V16h-.5A1.5 1.5 0 0 1 0 14.5z"/>
  <path d="M3 16h10v-5.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5zm9-16H4v5.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5zM9 1h2v4H9z"/>
  </symbol>
  <symbol id="back" viewBox="0 0 16 16" fill="currentColor">
    <path d="M.5 3.5A.5.5 0 0 0 0 4v8a.5.5 0 0 0 1 0V8.753l6.267 3.636c.54.313 1.233-.066 1.233-.697v-2.94l6.267 3.636c.54.314 1.233-.065 1.233-.696V4.308c0-.63-.693-1.01-1.233-.696L8.5 7.248v-2.94c0-.63-.692-1.01-1.233-.696L1 7.248V4a.5.5 0 0 0-.5-.5"/>
  </symbol>
</svg>

<style>
select {
  appearance: none; /* Remove default arrow */
  background-color: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 10px 40px 10px 15px; /* Extra right padding for arrow */
  font-size: 16px;
  cursor: pointer;
  /*background-image: url('custom-arrow.svg');  Path to your arrow icon */
  background-repeat: no-repeat;
  background-position: right 15px center;
}
</style>

<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 mt-4">
        <div class="card">
          <div class="card-header">
            <h2 class="fw-bold">Add Supplies</h2>
          </div>
          <div class="card-body">
            <form action="" method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <!--Category-->
              <div class="mb-3 col">
                <div class="row">
                  <label for="category" class="form-label">Category</label>
                </div>
                <div class="row" class="form-control ms-2" style="width: 685px;" >
                  <select name="category_id" id="category2" style="width: 685px; margin-left: 10px;">
                    <option value="" >--Select Category--</option>
                    {% for category in categories %}
                      <option value="{{ category.id }}" {% if category.id|stringformat:"s" == selected_category %}selected{% endif %}>
                        {{ category.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <!--Product-->
              <div class="mb-3 col">
                <div class="row">
                  <label for="product" class="form-label">Product</label>
                </div>
                <div class="row" class="form-control ms-2" style="width: 685px;" >
                  <select name="product_id" id="product" style="width: 685px; margin-left: 10px;">
                    <option value="" >--Select Product--</option>
                    {% for product in products %}
                      <option value="{{ product.id }}" {% if product.id|stringformat:"s" == selected_product %}selected{% endif %}>
                        {{ product.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <!--Item-->
              <div class="mb-3 col">
                <div class="row">
                  <label for="item" class="form-label">Item</label>
                </div>
                <div class="row" class="form-control ms-2" style="width: 685px;" >
                  <select name="item_id" id="item" style="width: 685px; margin-left: 10px;">
                    <option value="" >--Select Item--</option>
                    {% for item in items %}
                      <option value="{{ item.id }}" {% if item.id|stringformat:"s" == selected_item %}selected{% endif %}>
                        {{ item.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>
              </div>
              <!--SizeTerm-->
              <div class="mb-3 col">
                <div class="row">
                  <label for="sizeTerm" class="form-label">Size</label>
                </div>
                <div class="row" class="form-control ms-2" style="width: 685px;" >
                  <select name="sizeTerm_id" id="sizeTerm" style="width: 685px; margin-left: 10px;">
                    <option value="" >--Select Size--</option>
                    {% for size in sizes %}
                      <option value="{{ size.id }}" {% if size.id|stringformat:"s" == selected_size %}selected{% endif %}>
                        {{ size.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="" class="form-label">Quantity</label>
                <input type="number" name="quantity" value="1" min="1" class="form-control" style="width:685px">
              </div>

              <div class="mb-3">
                <label for="" class="form-label">Location</label>
                <input type="text" name="location" class="form-control" />
              </div>
              
              <!--Below Buttons-->
              <button type="submit" class="btn btn-primary">
                <svg class="bi m-1" width="15" height="15">
                  <use xlink:href="#save"><!--Save--></use>
                </svg>
                Save
              </button>

              <a href="{% url "manage-supplies" %}" class="btn btn-dark">
                <svg class="bi m-1" width="15" height="15">
                  <use xlink:href="#back"><!--Back--></use>
                </svg>
                Back
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


<script>
  const categorySel = document.getElementById("category2");
  const productSel  = document.getElementById("product");
  const itemSel     = document.getElementById("item");
  const sizeTermSel = document.getElementById("sizeTerm");

  function resetSelect(select, placeholder) {
    select.innerHTML = `<option value="">${placeholder}</option>`;
  }

  function loadOptions(url, param, value, select, placeholder) {
  resetSelect(select, placeholder);
  if (!value) return Promise.resolve();

  const fullUrl = `${url}?${param}=${encodeURIComponent(value)}`;
  console.log("Fetching:", fullUrl);

  return fetch(fullUrl)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      console.log("Received:", data);
      data.forEach(row => {
        const opt = document.createElement("option");
        opt.value = row.id;
        opt.textContent = row.name;
        select.appendChild(opt);
      });
    })
    .catch(err => console.error("Dropdown load failed:", err));
}

  categorySel.addEventListener("change", function () {
    resetSelect(itemSel, "-- Select Item --");   // clear the lowest level too
    resetSelect(sizeTermSel, "-- Select Size --");   // clear the lowest level too
    loadOptions("{% url 'get-products' %}", "category_id", this.value,
                productSel, "-- Select Product --");
  });

  productSel.addEventListener("change", function () {
    resetSelect(sizeTermSel, "-- Select Size --"); 
    loadOptions("{% url 'get-items' %}", "product_id", this.value,
                itemSel, "-- Select Item --");
  });
  itemSel.addEventListener("change", function () {
    loadOptions("{% url 'get-size' %}", "item_id", this.value,
                sizeTermSel, "-- Select Size --");
  });
</script>

{% endblock %}
